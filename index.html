<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Live - Sistema & Mente</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            user-select: none;
        }

        body {
            background-color: #070a13;
            color: #ffffff;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Contenedor con escala automática para mantener la proporción 9:16 en cualquier pantalla */
        .scaler-wrapper {
            width: 1080px;
            height: 1920px;
            position: relative;
            transform-origin: center center;
            /* Se ajustará automáticamente por JavaScript según tu pantalla */
        }

        /* Canvas Matrix de Fondo */
        #matrixCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            display: none;
        }

        /* Fondo de Palabras Flotantes */
        #floatingContainer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
            display: none;
        }

        .floating-word {
            position: absolute;
            color: #38bdf8;
            opacity: 0.25;
            font-weight: 800;
            font-size: 28px;
            animation: floatUp 10s linear infinite;
        }

        @keyframes floatUp {
            0% { transform: translateY(1920px) rotate(0deg); opacity: 0; }
            20% { opacity: 0.3; }
            80% { opacity: 0.3; }
            100% { transform: translateY(-200px) rotate(15deg); opacity: 0; }
        }

        /* Estructura Principal */
        .app-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 1080px;
            height: 1920px;
            z-index: 10;
            display: flex;
            padding: 50px;
            gap: 30px;
        }

        /* Columna Izquierda (Contenido y Cajas) */
        .left-column {
            width: 680px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Columna Derecha (Área fija para el chat de TikTok) */
        .right-column {
            width: 310px;
            height: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 4px dashed #38bdf8;
            border-radius: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 25px;
        }

        .right-column p {
            color: #38bdf8;
            font-size: 22px;
            font-weight: 900;
            text-shadow: 0 0 10px rgba(56,189,248,0.5);
        }

        /* Panel de Control Superior (Botones) */
        .control-panel {
            background: rgba(15, 23, 42, 0.95);
            border: 3px solid #38bdf8;
            border-radius: 20px;
            padding: 18px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.4);
        }

        .btn-ctrl {
            background: #1e293b;
            color: #ffffff;
            border: 2px solid #38bdf8;
            padding: 12px 18px;
            border-radius: 14px;
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-ctrl:hover {
            background: #38bdf8;
            color: #000000;
            transform: scale(1.05);
            box-shadow: 0 0 15px #38bdf8;
        }

        /* Encabezado */
        .header {
            text-align: center;
            margin: 15px 0;
        }

        .header h1 {
            font-size: 44px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.6);
            letter-spacing: 1px;
        }

        .header p {
            font-size: 24px;
            color: #cbd5e1;
            margin-top: 10px;
            font-weight: 700;
        }

        /* Cuadrícula de Cajas Interactivas */
        .grid-boxes {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            width: 100%;
            margin: 20px 0;
        }

        .fact-box {
            height: 330px;
            border-radius: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 25px;
            text-align: center;
            border: 5px solid #ffffff;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8);
            transition: transform 0.2s ease, filter 0.2s ease;
        }

        .fact-box:hover {
            transform: translateY(-5px) scale(1.03);
            filter: brightness(1.15);
        }

        /* Colores vivos y seguros para las cajas */
        .box-1 { background: linear-gradient(135deg, #e11d48, #f43f5e); }
        .box-2 { background: linear-gradient(135deg, #7c3aed, #a855f7); }
        .box-3 { background: linear-gradient(135deg, #0284c7, #38bdf8); }
        .box-4 { background: linear-gradient(135deg, #059669, #34d399); }

        .fact-box .tag {
            font-size: 16px;
            font-weight: 900;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.5);
            padding: 6px 16px;
            border-radius: 12px;
            margin-bottom: 15px;
            border: 2px solid rgba(255,255,255,0.3);
        }

        .fact-box h3 {
            font-size: 48px;
            color: #ffffff;
            font-weight: 900;
            text-shadow: 0 4px 8px rgba(0,0,0,0.8);
        }

        .fact-box span {
            font-size: 24px;
            color: #ffffff;
            margin-top: 12px;
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: 800;
        }

        /* Ventana Flotante Mágica (Modal) */
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 1080px;
            height: 1920px;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(12px);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-card {
            background: #0f172a;
            border: 6px solid #38bdf8;
            width: 900px;
            padding: 60px;
            border-radius: 35px;
            text-align: center;
            box-shadow: 0 0 70px rgba(56, 189, 248, 0.7);
        }

        .modal-card .category-badge {
            display: inline-block;
            background: #38bdf8;
            color: #000000;
            font-size: 22px;
            font-weight: 900;
            padding: 8px 25px;
            border-radius: 20px;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        .modal-card h2 {
            font-size: 46px;
            color: #38bdf8;
            margin-bottom: 25px;
            font-weight: 900;
        }

        .modal-card p {
            font-size: 34px;
            line-height: 1.6;
            margin-bottom: 40px;
            font-weight: 700;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.05);
            padding: 30px;
            border-radius: 20px;
            border-left: 8px solid #38bdf8;
        }

        .btn-close {
            background: #38bdf8;
            color: #000000;
            border: none;
            padding: 20px 60px;
            font-size: 26px;
            font-weight: 900;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(56,189,248,0.5);
            transition: transform 0.2s;
        }

        .btn-close:hover {
            transform: scale(1.05);
        }

        /* Footer */
        .footer-live {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.95);
            padding: 20px 30px;
            border-radius: 20px;
            border: 2px solid #38bdf8;
        }

        .live-badge {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 900;
            font-size: 24px;
            color: #ef4444;
        }

        .live-dot {
            width: 18px;
            height: 18px;
            background: #ef4444;
            border-radius: 50%;
            box-shadow: 0 0 12px #ef4444;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.5; }
            100% { transform: scale(1.3); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="scaler-wrapper" id="scalerWrapper">
        <!-- Canvas Matrix -->
        <canvas id="matrixCanvas"></canvas>

        <!-- Fondo de Textos Flotantes -->
        <div id="floatingContainer"></div>

        <!-- Reproductor de Audio -->
        <audio id="bgMusic" loop></audio>

        <div class="app-container">
            <!-- Columna Izquierda: Cajas y Controles -->
            <div class="left-column">
                <!-- Panel de Control (Botones Superiores) -->
                <div class="control-panel">
                    <button class="btn-ctrl" onclick="toggleMatrix()">🟢 Matrix</button>
                    <button class="btn-ctrl" onclick="toggleFloatingWords()">✨ Flotantes</button>
                    <button class="btn-ctrl" onclick="toggleMusic()">🎵 Música On/Off</button>
                    <button class="btn-ctrl" onclick="nextSong()">⏭️ Sig. Música</button>
                    <button class="btn-ctrl" onclick="loadRandomFacts()">🔄 Cambiar Cajas</button>
                </div>

                <!-- Encabezado -->
                <div class="header">
                    <h1>SISTEMA & MENTE</h1>
                    <p>👇 Pide una caja en el chat para revelar el facto</p>
                </div>

                <!-- Cajas Interactivas -->
                <div class="grid-boxes" id="boxesGrid">
                    <!-- Se generan dinámicamente -->
                </div>

                <!-- Footer / Estado -->
                <div class="footer-live">
                    <div class="live-badge">
                        <div class="live-dot"></div> TIKTOK LIVE
                    </div>
                    <div style="font-size: 20px; font-weight: 800;" id="trackTitle">Música: Pausada</div>
                </div>
            </div>

            <!-- Columna Derecha: Espacio para el Chat de TikTok -->
            <div class="right-column">
                <p>💬 CHAT DE TIKTOK</p>
                <span style="font-size: 16px; color: #94a3b8; margin-top: 15px;"></span>
            </div>
        </div>

        <!-- Ventana Flotante Mágica (Modal) -->
        <div class="modal-overlay" id="modalOverlay" onclick="closeModal()">
            <div class="modal-card" onclick="event.stopPropagation()">
                <div class="category-badge" id="modalBadge">CATEGORÍA</div>
                <h2 id="modalTitle">Título del Facto</h2>
                <p id="modalText">Texto del facto...</p>
                <button class="btn-close" onclick="closeModal()">CERRAR / SIGUIENTE</button>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script>
        // Auto-escala perfecta para cualquier pantalla
        function autoResizeApp() {
            const wrapper = document.getElementById('scalerWrapper');
            const scaleX = window.innerWidth / 1080;
            const scaleY = window.innerHeight / 1920;
            const scale = Math.min(scaleX, scaleY);
            wrapper.style.transform = `scale(${scale})`;
        }
        window.addEventListener('resize', autoResizeApp);
        window.onload = function() {
            autoResizeApp();
            loadRandomFacts();
            initMatrix();
            initFloatingWords();
        };

        const dbFactos = [
            { id: 1, categoria: "HARDWARE & MENTE", titulo: "Cuello de Botella", facto: "En una PC, un procesador potente no sirve de nada si la RAM es lenta y causa un 'cuello de botella'. En la vida pasa igual: puedes tener muchas ganas, pero si te rodeas de personas que frenan tu ritmo, tu potencial se queda atrapado." },
            { id: 2, categoria: "SISTEMA & EMOCIÓN", titulo: "Memoria Caché", facto: "Cuando tu navegador se llena de archivos de caché viejos, se vuelve lento y falla. Tu mente funciona igual: cuando la llenas de rencores y pensamientos del pasado que no has borrado, colapsas antes de empezar el día." },
            { id: 3, categoria: "HARDWARE & MENTE", titulo: "Pasta Térmica", facto: "Un procesador se sobrecalienta y se apaga cuando la pasta térmica se seca. Las personas colapsamos igual: si no expresas lo que sientes y te guardas el estrés, tu sistema se 'apaga' emocionalmente para evitar un daño peor." },
            { id: 4, categoria: "CÓDIGO & VIDA", titulo: "Bucle Infinito", facto: "Un bucle infinito en código ocurre cuando una condición nunca se cumple y el programa se congela. Sobrepensar a las 2:00 AM es exactamente eso: tu cerebro ejecutando la misma duda una y otra vez sin llegar a una solución." },
            { id: 5, categoria: "SISTEMA & EMOCIÓN", titulo: "Hard Reset", facto: "A veces, la única forma de corregir un fallo grave en un sistema es un reinicio forzado. Cortar contacto, cambiar de entorno y empezar de cero no es fracasar, es el 'Hard Reset' que tu vida necesitaba para volver a funcionar bien." },
            { id: 6, categoria: "CÓDIGO & VIDA", titulo: "Error de Lógica", facto: "En código, un error de sintaxis detiene el programa de inmediato, pero un error de lógica lo deja correr haciendo las cosas mal sin darte cuenta. En las relaciones es igual: el problema a veces no es lo que dices, sino asumir intenciones que nunca existieron." },
            { id: 7, categoria: "REFLEXIÓN", titulo: "El Verdadero Soltar", facto: "Aceptar que alguien ya no te quiere en su vida también es una forma de quererte a ti mismo." },
            { id: 8, categoria: "REFLEXIÓN", titulo: "Expectativa vs Realidad", facto: "El problema no es que extrañes a esa persona, extrañas la versión de ella que tú mismo creaste en tu mente." },
            { id: 9, categoria: "HARDWARE & MENTE", titulo: "Mito de la RAM", facto: "Tener más Memoria RAM no hace tu computadora más rápida, solo te permite abrir más programas a la vez. En la mente es igual: acumular muchas metas al mismo tiempo no te hace avanzar más rápido, solo te distrae." },
            { id: 10, categoria: "REFLEXIÓN", titulo: "Silencios que Hablan", facto: "Hay conversaciones que nunca vas a tener con la persona que te dolía, y está bien: la paz se encuentra en no necesitar su explicación." }
        ];

        const playlist = [
            { nombre: "Pista Lofi 01", url: "musica1.mp3" },
            { nombre: "Pista Lofi 02", url: "musica2.mp3" },
            { nombre: "Pista Ambient 03", url: "musica3.mp3" },
            { nombre: "Pista Ambient 03", url: "musica5.mp3" },
              { nombre: "Pista Ambient 03", url: "musica75.mp3" },
            { nombre: "Pista Ambient 03", url: "musica76.mp3" },
            { nombre: "Pista Ambient 03", url: "musica77.mp3" },
            { nombre: "Pista Ambient 03", url: "musica78.mp3" },
         
            
        ];
        let currentTrack = 0;
        let isPlaying = false;

        // Generar 4 Cajas Aleatorias
        function loadRandomFacts() {
            const shuffled = [...dbFactos].sort(() => 0.5 - Math.random());
            const selected = shuffled.slice(0, 4);
            const grid = document.getElementById('boxesGrid');
            grid.innerHTML = '';

            const boxStyles = ['box-1', 'box-2', 'box-3', 'box-4'];

            selected.forEach((item, index) => {
                const box = document.createElement('div');
                box.className = `fact-box ${boxStyles[index]}`;
                box.innerHTML = `
                    <div class="tag">[ ${item.categoria} ]</div>
                    <h3>CAJA 0${index + 1}</h3>
                    <span>${item.titulo}</span>
                `;
                box.onclick = () => openModal(item);
                grid.appendChild(box);
            });
        }

        // Ventana Modal
        function openModal(item) {
            document.getElementById('modalBadge').innerText = item.categoria;
            document.getElementById('modalTitle').innerText = item.titulo;
            document.getElementById('modalText').innerText = `"${item.facto}"`;
            document.getElementById('modalOverlay').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
        }

        // Controles de Música
        function toggleMusic() {
            const player = document.getElementById('bgMusic');
            if (!isPlaying) {
                player.src = playlist[currentTrack].url;
                player.play().then(() => {
                    isPlaying = true;
                    document.getElementById('trackTitle').innerText = `Música: ${playlist[currentTrack].nombre}`;
                }).catch(() => {
                    alert("Coloca tus archivos MP3 (ej. musica1.mp3) en la misma carpeta de tu proyecto.");
                });
            } else {
                player.pause();
                isPlaying = false;
                document.getElementById('trackTitle').innerText = "Música: Pausada";
            }
        }

        function nextSong() {
            currentTrack = (currentTrack + 1) % playlist.length;
            const player = document.getElementById('bgMusic');
            player.src = playlist[currentTrack].url;
            if (isPlaying) {
                player.play();
                document.getElementById('trackTitle').innerText = `Música: ${playlist[currentTrack].nombre}`;
            }
        }

        // Efecto Matrix
        let matrixActive = false;
        function initMatrix() {
            const canvas = document.getElementById('matrixCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 1080;
            canvas.height = 1920;

            const letters = "01SYSTEM_MENTE_HARDWARE";
            const fontSize = 16;
            const columns = canvas.width / fontSize;
            const drops = Array(Math.floor(columns)).fill(1);

            function draw() {
                ctx.fillStyle = 'rgba(7, 10, 19, 0.08)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#38bdf8';
                ctx.font = fontSize + 'px "Share Tech Mono", monospace';

                for (let i = 0; i < drops.length; i++) {
                    const text = letters.charAt(Math.floor(Math.random() * letters.length));
                    ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                    if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                        drops[i] = 0;
                    }
                    drops[i]++;
                }
            }
            window.matrixLoop = draw;
        }

        function toggleMatrix() {
            matrixActive = !matrixActive;
            const canvas = document.getElementById('matrixCanvas');
            if (matrixActive) {
                canvas.style.display = 'block';
                window.matrixTimer = setInterval(window.matrixLoop, 35);
            } else {
                canvas.style.display = 'none';
                clearInterval(window.matrixTimer);
            }
        }

        // Textos Flotantes
        let floatingActive = false;
        function initFloatingWords() {
            const container = document.getElementById('floatingContainer');
            const words = ["Hardware", "RAM", "CPU", "Bucle", "HardReset", "Sistema", "Mente"];
            
            for (let i = 0; i < 15; i++) {
                const div = document.createElement('div');
                div.className = 'floating-word';
                div.innerText = words[Math.floor(Math.random() * words.length)];
                div.style.left = Math.random() * 100 + '%';
                div.style.animationDuration = (8 + Math.random() * 8) + 's';
                div.style.animationDelay = (Math.random() * 5) + 's';
                container.appendChild(div);
            }
        }

        function toggleFloatingWords() {
            floatingActive = !floatingActive;
            const container = document.getElementById('floatingContainer');
            container.style.display = floatingActive ? 'block' : 'none';
        }
    </script>
</body>
</html>
